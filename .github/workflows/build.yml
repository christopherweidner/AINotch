name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  core-linux:
    # The platform-independent core (parser, pricing, session tracking, hook IPC).
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos:
    runs-on: macos-14 # Apple Silicon
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: swift test
      - run: scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AINotch
          path: build/AINotch.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/AINotch.zip
          generate_release_notes: true
